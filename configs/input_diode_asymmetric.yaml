# 1D diode simulation input parameters - STRONGLY ASYMMETRIC doping variant
# of input_diode.yaml: p-side 1e17 cm^-3 (unchanged from the default), n-side
# 1e21 cm^-3 (vs the default's 1e16) - well above silicon's conduction-band
# effective density of states (Nc~2.8e19 cm^-3), i.e. genuinely degenerate.
#
# Run with: python3 main.py input_diode_asymmetric.yaml
#
# What this is for: comparing Maxwell-Boltzmann (what the actual nonlinear
# Poisson+continuity PDE solve uses throughout - see physics.py) against
# Fermi-Dirac statistics (fermi_dirac.py) for the CLOSED-FORM reference
# curves only - built-in potential, Shockley I0, and depletion/diffusion
# capacitance. See fermi_dirac.py's module docstring for exactly what is
# and isn't corrected (the numeric PDE solve itself is NOT re-derived with
# a generalized Einstein relation - that's a substantially bigger project;
# this compares Boltzmann vs Fermi-Dirac at the level the two statistics
# actually diverge for THIS doping: the degenerate n-side's own equilibrium
# reference, not the transport physics).

doping:
  p_side:
    type: flat
    concentration_cm3: 1.0e17
  n_side:
    type: flat
    concentration_cm3: 1.0e21   # degenerate: Nd > Nc (~2.8e19) for Si.
                                # This is the real target doping (matches a
                                # MOSFET source/drain against a lighter
                                # substrate) - it used to be dialed back to
                                # 1e20 and forward-bias-only because neither
                                # Newton nor Gummel converged robustly at
                                # 1e21 across reverse bias (see the pinned
                                # tcad1d-extreme-doping-convergence-limit
                                # note for the full history). Fixed by
                                # switching to the newton_qf solver below -
                                # full sweep including reverse bias now
                                # converges cleanly at the real 1e21 doping.

thickness:
  Wp_um: null
  Wn_um: null

material:
  # eps_r: 11.7
  # ni_cm3: 1.0e10

mesh:
  growth: 1.06
  bulk_spacing_debye_factor: 5.0
  junction_spacing_debye_factor: 0.05

voltage_sweep:
  # Full sweep including reverse bias - this used to be forward-bias-only
  # (see the pinned tcad1d-extreme-doping-convergence-limit note) until the
  # newton_qf solver fixed convergence there too. Vbi (Boltzmann) ~1.01V,
  # Vbi (Fermi-Dirac) ~1.04V at this doping.
  reverse_start_V: -2.0
  reverse_stop_V: -0.05
  reverse_points: 15
  forward_start_V: 0.0
  forward_stop_V: 1.0
  forward_points: 30

solver:
  # newton_qf (not gummel or the raw-density newton): this doping is
  # strongly asymmetric/degenerate, and this is the specific case that
  # motivated adding newton_qf in the first place - quasi-Fermi-potential
  # unknowns with a plain-gradient current (see newton_solver_qf.py),
  # modeled on the open-source FLOOXS device simulator's "QF" model. Neither
  # gummel nor the raw-density newton converges robustly here across reverse
  # bias (see the pinned tcad1d-extreme-doping-convergence-limit note for
  # the full history of what was tried first and why it didn't work).
  math_model: newton_qf

output:
  save_bias_points: [0.45, 0.6, 0.75, 0.9, 1.0]
  structure_file: diode_asym_structure.json
