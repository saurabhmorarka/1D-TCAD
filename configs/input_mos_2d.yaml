# First 2D MOS capacitor: same oxide + ideal metal gate as the 1D MOS
# capacitor (configs/input_mos.yaml), patterned the same way the diode's p+
# square was (mesh2d/geometry2d.py::TopMesa) - a gate/oxide stack sitting on
# TOP of (protruding above) a block of lightly-doped p substrate, rather
# than dug into it (an oxide is not a doping region, so painter's-algorithm
# "digging in" doesn't apply the way it did for the diode's p+ region).
#
# Domain convention: x in [0, width_um], y in [0, height_um], y=0 is the
# substrate's own flat top surface; the mesa protrudes to y=-oxide
# thickness over the gate's x-range only. Left/right (x=0, x=width_um) are
# always the `symmetry` boundary.

geometry:
  width_um: 20.0
  height_um: 10.0

  substrate:
    doping_type: p
    concentration_cm3: 1.0e16

  # The oxide is NOT dug into the substrate - it protrudes above y=0 (see
  # `mesas:` below), so its y_range's first value is negative.
  regions:
    - name: oxide
      kind: insulator
      eps_r: 3.9
      x_range_um: [7.0, 13.0]     # centered, same footprint as the diode's p_well
      y_range_um: [-0.01, 0.0]    # 10nm thick (not the 1D example's 1nm - a mesh-
                                    # ability tradeoff; this model has no gate
                                    # tunneling leakage regardless of thickness, so
                                    # nothing physical is lost by picking a
                                    # 2D-triangulation-friendlier value)

  mesas:
    - x_range_um: [7.0, 13.0]
      height_um: 0.01              # must match the oxide region's own thickness

contacts:
  # Gate sits directly on the oxide's own top surface (an ideal metal
  # contact, same convention as the 1D MOS capacitor's Cdop_gate=None case).
  - name: gate
    surface: top
    x_range_um: [7.0, 13.0]
    bias_role: anode

  # Substrate back contact, full bottom width, grounded (never swept).
  - name: substrate
    surface: bottom
    x_range_um: [0.0, 20.0]
    bias_role: cathode

material:
  # Silicon defaults (same as input_mos.yaml) - leave commented out.
  # eps_r: 11.7
  # ni_cm3: 1.0e10

gate:
  workfunction_eV: null   # null = ideal MOS (V_FB=0), matching input_mos.yaml's default

mesh:
  # h_min applies at the oxide/substrate interface (and, since the oxide is
  # only 10nm thick, ends up governing the WHOLE oxide region too - there's
  # no point in the oxide farther than 10nm from that interface); h_max in
  # the bulk substrate far from it.
  h_min_um: 0.002
  h_max_um: 1.5
  growth: 1.3
  min_angle_deg: 25   # relaxed from the diode's 32 to keep the thin oxide's
                        # triangle count from exploding under Ruppert refinement

voltage_sweep:
  vg_start_V: -1.0
  vg_stop_V: 2.0
  vg_points: 31

output:
  structure_file: mos2d_structure.json
  # Which VG values (nearest swept match) to save FULL SPATIAL field
  # profiles for - same convention as the diode's save_bias_points.
  save_bias_points: [-1.0, -0.4, 0.0, 0.6, 1.2, 2.0]
